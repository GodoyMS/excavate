# The performance harness — M1's budgets, asserted against the real corpora.
#
# M0 built the expensive, fiddly part and deliberately asserted nothing: getting two
# reference corpora onto a runner with full history, and refusing to invent thresholds,
# because a fabricated budget either fails honest work or passes a regression, and
# either way teaches people to ignore red.
#
# M1 supplies the numbers, so `scripts/perf-assert.mjs` now runs here. Measured when
# wired up, on an M-series laptop:
#
#     ripgrep         2,255 commits   147k/min   1.0s   1.59 KB/commit   0 noise in top 50
#     rust-analyzer  12,864 commits    76k/min  10.7s   2.42 KB/commit   0 noise in top 50
#
# against budgets of 25k commits/min, 8s and 45s, and 3 KB/commit (ADR-0003, which
# supersedes ROADMAP M1's "≤ 5% of `.git`" — see the ADR for why that one was
# unreachable and measured git's compression rather than our storage).
#
# LEAN-V1 §3.1 cuts the five reference corpora of Part 13 §13.8.3 down to two
# in CI — `ripgrep` (~2k commits) and `rust-analyzer` (~20k commits) — with `react` and
# `linux` run manually before releases.
#
# `workflow_dispatch` only, and with no inputs. Cloning ~20k commits of history on every
# pull request would make CI the thing that stalls the cadence (ROADMAP §3, items 7 and
# 8), which is exactly the failure this repository is trying to avoid. A "which corpus"
# input was tried and removed: `matrix` is not available in a job-level `if`, so
# selecting one corpus left the other job *skipped*, and a skipped job reports green
# having measured nothing. A green check that measured nothing is the one outcome this
# project cannot afford.
name: Performance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  corpus:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    # Perf numbers are only comparable across runs on identical hardware, so this is
    # single-platform on purpose: `ubuntu-latest` is the reference runner. macOS
    # correctness lives in ci.yml.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # `budget` is ROADMAP M1's full-index wall clock for that corpus.
          - name: ripgrep
            repo: BurntSushi/ripgrep
            budget: 8
          - name: rust-analyzer
            repo: rust-lang/rust-analyzer
            budget: 45

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # `scripts/perf-assert.mjs` imports the packages' built output, not their source, so it
      # measures what a user installing from npm would run rather than what a bundler could
      # optimise differently.
      - name: Build
        run: pnpm build

      # fetch-depth: 0 because the whole point is walking history — a shallow clone
      # measures nothing. No `--filter=blob:none` either: blame and hunk extraction
      # (M2) need the blobs, and a partial clone would move that cost into the
      # measurement as on-demand fetches.
      #
      # persist-credentials: false — the corpus is third-party public code and this job
      # never pushes anywhere.
      #
      # TODO(M1): pin each corpus to an exact SHA (`ref:` here, plus the SHA in the
      # matrix) and cache the clone. Part 13 §13.8.3 requires the corpora be pinned so
      # results stay comparable; an unpinned default branch silently changes the
      # denominator between runs. Left unpinned rather than filled with a guessed SHA,
      # and caching is only meaningful once the ref is fixed.
      - name: Fetch corpus
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo }}
          path: corpora/${{ matrix.name }}
          fetch-depth: 0
          persist-credentials: false
          show-progress: false

      # Real, verifiable facts about the corpus — no budgets. The commit count is the
      # number every M1 throughput assertion divides by, so establishing it is the
      # harness's job today.
      #
      # The one thing this *does* assert is that the clone is not shallow, because that
      # is the failure this step exists to catch: a shallow corpus still prints a
      # commit count, still exits 0, and would quietly make every future throughput
      # number meaningless. It is a structural check, not an invented threshold.
      #
      # Values are captured into variables rather than interpolated into `echo`
      # arguments: `set -e` does not abort on a command substitution that fails inside
      # an argument list, so `echo "commits: $(git rev-list --count HEAD)"` would print
      # an empty value and pass.
      - name: Describe corpus
        working-directory: corpora/${{ matrix.name }}
        run: |
          set -euo pipefail
          shallow=$(git rev-parse --is-shallow-repository)
          if [ "$shallow" != 'false' ]; then
            echo "::error::corpus clone is shallow — every throughput number derived from it would be meaningless"
            exit 1
          fi
          head=$(git rev-parse HEAD)
          commits=$(git rev-list --count HEAD)
          gitdir=$(du -sh .git | cut -f1)
          echo "corpus:  ${{ matrix.repo }}"
          echo "head:    $head"
          echo "commits: $commits"
          echo "git dir: $gitdir"

      # ROADMAP M1's four perf budgets plus the anti-embarrassment assertion, which the
      # milestone requires "on all three targets" — the fixture corpus is covered by
      # `tests/significance-noise.test.ts` in ci.yml, and these two are the other two.
      #
      # A fixture cannot stand in for either half. Throughput and index size need a corpus
      # large enough for the numbers to mean something, and the noise assertion is only
      # interesting against commits nobody wrote for the test: proving that `style: rustfmt
      # everything` is penalised in a fixture built to contain it proves the fixture, while
      # proving it on ripgrep proves the scoring.
      #
      # The script fails the job on throughput, index size, and noise ranking, and only warns
      # on wall clock — see its header for why gating on runner speed would make this workflow
      # noise rather than signal.
      - name: Perf budgets and anti-embarrassment
        run: node scripts/perf-assert.mjs corpora/${{ matrix.name }} --budget-seconds=${{ matrix.budget }}
